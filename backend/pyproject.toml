[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "geoalchemy2>=0.18.1",
    "httpx>=0.28.1",
    "redis>=8.1.0",
]

[dependency-groups]
dev = [
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "bcrypt>=5.0.0",
    "fastapi>=0.137.2",
    "pydantic-extra-types[phonenumbers]>=2.11.1",
    "pydantic-settings>=2.14.1",
    "pydantic[email]>=2.13.4",
    "pytest>=9.1.0",
    "pytest-asyncio>=1.4.0",
    "python-jose[cryptography]>=3.5.0",
    "sqlalchemy[asyncio]>=2.0.51",
    "uvicorn[standard]>=0.49.0",
]

[tool.pytest.ini_options]
# async def-тесты и фикстуры работают без декораторов
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# чтобы `from core... import ...` работал при запуске pytest из папки backend
pythonpath = ["."]
markers = [
    "integration: тесты, которым нужен запущенный Redis",
]

