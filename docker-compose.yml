services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: cargoradar-frontend

    ports:
      - "3000:3000"

    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

    environment:
      WATCHPACK_POLLING: "true"
      # (server components не могут использовать localhost — см. lib/main/get-faqs.ts)
      INTERNAL_API_URL: http://backend:8000/api

    depends_on:
      - backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: cargoradar-backend

    ports:
      - "8000:8000"

    volumes:
      - ./backend:/app
      - /app/.venv

    environment:
      WATCHFILES_FORCE_POLLING: "true"
      OSRM_URL: http://osrm:5000
      DATABASE_URL: postgresql+asyncpg://admin:${POSTGRES_PASSWORD}@postgres:5432/cargoradardb

      # redis внутри docker сети доступен по имени сервиса
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1,::1}

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgis/postgis:17-3.5
    platform: linux/amd64

    container_name: cargoradar-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: cargoradardb
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d cargoradardb"]
      interval: 5s
      timeout: 5s
      retries: 5
  redis:
    image: redis:latest

    container_name: cargoradar-redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    command: redis-server --appendonly yes

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # OSRM — роутинг по дорогам (профиль truck-soft, Беларусь).
  # Данные готовятся один раз: docker compose --profile tools run --rm osrm-prepare
  osrm-prepare:
    image: ghcr.io/project-osrm/osrm-backend:v5.27.1
    container_name: cargoradar-osrm-prepare
    profiles: ["tools"]  # не запускается при обычном `docker compose up`
    volumes:
      - ./osrm/data:/data
      - ./osrm/profiles:/opt/profiles
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        # В образе OSRM нет truck-профиля: он лежит в ./osrm/profiles (см. README).
        # Остальные модули профиля (lib/set, lib/access, ...) берём из самого образа;
        # cp -n не перезатирает кастомный lib/way_handlers.lua из truck-soft.
        mkdir -p /opt/profiles/lib
        cp -n /opt/lib/*.lua /opt/profiles/lib/ 2>/dev/null || true
        osrm-extract -p /opt/profiles/truck.lua /data/region.osm.pbf
        osrm-partition /data/region.osrm
        osrm-customize /data/region.osrm
        echo "OSRM data готовы: /data/region.osrm*"

  osrm:
    image: ghcr.io/project-osrm/osrm-backend:v5.27.1
    container_name: cargoradar-osrm
    restart: unless-stopped
    volumes:
      - ./osrm/data:/data
      - ./osrm/healthcheck.sh:/opt/healthcheck.sh:ro
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        # osrm-extract в 5.27 не создаёт базовый файл region.osrm: данные лежат в
        # region.osrm.*, поэтому признак готовности — region.osrm.mldgr от osrm-customize.
        if [ ! -f /data/region.osrm.mldgr ]; then
          echo "Данные OSRM не подготовлены: docker compose --profile tools run --rm osrm-prepare" >&2
          exit 1
        fi
        exec osrm-routed --algorithm mld --max-table-size 10000 /data/region.osrm
    ports:
      # на хосте 5001, потому что 5000 на макоси занимает AirPlay Receiver
      - "5001:5000"
    healthcheck:
      # в образе нет wget/curl, поэтому HTTP проверяем bash-скриптом через /dev/tcp
      test: ["CMD", "bash", "/opt/healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
  redis_data: