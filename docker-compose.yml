services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: cargoradar-frontend

    ports:
      - "3000:3000"

    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

    environment:
      WATCHPACK_POLLING: "true"
      # (server components не могут использовать localhost — см. lib/main/get-faqs.ts)
      INTERNAL_API_URL: http://backend:8000/api

    depends_on:
      - backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: cargoradar-backend

    ports:
      - "8000:8000"

    volumes:
      - ./backend:/app
      - /app/.venv

    environment:
      WATCHFILES_FORCE_POLLING: "true"
      OSRM_URL: http://osrm:5000
      DATABASE_URL: postgresql+asyncpg://admin:${POSTGRES_PASSWORD}@postgres:5432/cargoradardb

      # redis внутри docker-сети доступен по имени сервиса
      REDIS_HOST: redis
      REDIS_PORT: "6379"

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgis/postgis:17-3.5
    platform: linux/amd64

    container_name: cargoradar-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: cargoradardb
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d cargoradardb"]
      interval: 5s
      timeout: 5s
      retries: 5
  redis:
    image: redis:latest

    container_name: cargoradar-redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    command: redis-server --appendonly yes

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  osrm-prepare:
    image: osrm/osrm-backend
    container_name: cargoradar-osrm-prepare
    profiles: ["tools"]  # не запускается при обычном `docker compose up`
    volumes:
      - ./osrm/data:/data
      - ./osrm/profiles:/opt/profiles
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        osrm-extract -p /opt/profiles/truck.lua /data/region.osm.pbf &&
        osrm-partition /data/region.osrm &&
        osrm-customize /data/region.osrm

  osrm:
    image: osrm/osrm-backend
    container_name: cargoradar-osrm
    restart: unless-stopped
    volumes:
      - ./osrm/data:/data
    command: osrm-routed --algorithm mld --max-table-size 10000 /data/region.osrm
    ports:
      - "5001:5000"  # 5000 занят фронтом? нет, но на всякий случай не конфликтуем с популярным портом
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/route/v1/driving/27.5615,53.9006;27.5715,53.9106 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data: